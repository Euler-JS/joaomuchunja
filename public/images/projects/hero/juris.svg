<svg width="1024" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-hero4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#grad-hero4)"/>
  
  <!-- Decorative elements -->
  <circle cx="180" cy="100" r="45" fill="rgba(255,255,255,0.1)"/>
  <circle cx="850" cy="380" r="50" fill="rgba(255,255,255,0.08)"/>
  <circle cx="250" cy="420" r="35" fill="rgba(255,255,255,0.12)"/>
  
  <!-- Title -->
  <text x="512" y="220" dominant-baseline="middle" text-anchor="middle" 
        font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">
    Juris
  </text>
  
  <!-- Subtitle -->
  <text x="512" y="290" dominant-baseline="middle" text-anchor="middle" 
